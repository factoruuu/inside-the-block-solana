[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inside-the-block"
version = "0.1.0"
description = "Measure how Solana validators order transactions inside their blocks, using self-sent transactions in targeted leader windows."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "solders>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
itb = "itb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
